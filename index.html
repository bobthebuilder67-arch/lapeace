var curTab = 'pc', curQuery = '';

function pcCard(g) {
  return '<a class="card img-card" href="' + g.url + '"><img src="' + g.img + '" alt="' + g.n + '" loading="lazy"><div class="c-body"><span class="c-name">' + g.n + '</span><div class="c-sub">port by ' + g.sub + '</div></div></a>';
}
function tileCard(g) {
  return '<a class="card" href="' + g.u + '"><span class="tile">' + g.t + '</span><span>' + g.n + '</span></a>';
}
function matches(g, q) { return !q || g.n.toLowerCase().indexOf(q) !== -1; }

function render() {
  var q = curQuery;
  var gridPc = document.getElementById('grid-pc');
  var gridWeb = document.getElementById('grid-web');
  var gridRetro = document.getElementById('grid-retro');
  var empty = document.getElementById('empty');

  var pc = PC_GAMES.filter(function (g) { return matches(g, q); });
  var web = WEB_GAMES.filter(function (g) { return matches(g, q); });
  var retro = RETRO_GAMES.filter(function (g) { return matches(g, q); });

  gridPc.innerHTML = pc.map(pcCard).join('');
  gridWeb.innerHTML = web.map(tileCard).join('');
  gridRetro.innerHTML = retro.map(tileCard).join('');

  document.getElementById('n-pc').textContent = pc.length;
  document.getElementById('n-web').textContent = web.length;
  document.getElementById('n-retro').textContent = retro.length;

  var total = pc.length + web.length + retro.length;
  document.getElementById('count').textContent = total + ' items';

  gridPc.hidden = curTab !== 'pc';
  gridWeb.hidden = curTab !== 'web';
  gridRetro.hidden = curTab !== 'retro';
  document.getElementById('sec-label').textContent = curTab === 'pc' ? 'PC' : curTab === 'web' ? 'WEB' : 'RETRO';
  var shown = curTab === 'pc' ? pc.length : curTab === 'web' ? web.length : retro.length;
  empty.hidden = shown > 0;
}

function setTab(t) {
  curTab = t;
  document.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('active'); });
  document.getElementById('tab-' + t).classList.add('active');
  render();
}

function onSearch(v) { curQuery = v.trim().toLowerCase(); render(); }

render();
