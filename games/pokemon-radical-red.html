<div class="stage" id="stage"><iframe id="game" srcdoc="&lt;html&gt;

&lt;!-- Ultimate Game Stash file--&gt; 
&lt;!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ --&gt;


  &lt;head&gt;
    &lt;script&gt;
      window.gameconfig = {
        name: &quot;Pokemon radical red&quot;,
        url: &quot;https://cdn.jsdelivr.net/gh/bubbls/ugss@5d68b95d0791cb9ee118f1c90c3f8008ab2f84a2/radical%20red/Pokemon%20-%20FireRed%20Version%20(USA%2C%20Europe)%20(patched)%20(1).gba&quot;,
        core: &quot;gba&quot;,
        min: 1,
        max: 2,
      };
    &lt;/script&gt;
    &lt;script&gt;
      function mergeFiles(fileParts, cb) {
        return new Promise((resolve, reject) =&gt; {
          let buffers = [];
          function fetchPart(index) {
            if (index &gt;= fileParts.length) {
              let mergedBlob = new Blob(buffers);
              let mergedFileUrl = URL.createObjectURL(mergedBlob);
              resolve(mergedFileUrl);
              return;
            }
            fetch(fileParts[index])
              .then((response) =&gt; response.arrayBuffer())
              .then((data) =&gt; {
                buffers.push(data);
                fetchPart(index + 1);
              })
              .catch(reject);
            cb(index);
          }
          fetchPart(0);
        });
      }
      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i &lt;= end; i++) {
          parts.push(file + &quot;.part&quot; + i);
        }
        return parts;
      }
    &lt;/script&gt;
    &lt;style&gt;
      body,
      html {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }
      #game-container {
        text-align: center;
        width: 100%;
        height: 100%;
      }
      #loading-progress {
        font-size: 18px;
        margin-top: 20px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        display: inline-block;
      }
    &lt;/style&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;div id=&quot;game-container&quot;&gt;
      &lt;div id=&quot;game&quot;&gt;&lt;/div&gt;
      &lt;div id=&quot;loading-progress&quot;&gt;Loading: 0/0&lt;/div&gt;
      &lt;div id=&quot;first-time&quot;&gt;First-time loading may take longer...&lt;/div&gt;
    &lt;/div&gt;
    &lt;script&gt;
      var parts = getParts(
        window.gameconfig.url,
        window.gameconfig.min,
        window.gameconfig.max
      );
      var totalParts = parts.length;

      function updateLoadingProgress(loaded) {
        const progressElement = document.getElementById(&quot;loading-progress&quot;);
        if (loaded === 0) {
          progressElement.textContent = &quot;Loading: 0/0&quot;;
        } else {
          progressElement.textContent = `Loading: ${loaded}/${totalParts}`;
        }
      }

      Promise.all([mergeFiles(parts, updateLoadingProgress)])
        .then(([gameUrl]) =&gt; {
          document.getElementById(&quot;loading-progress&quot;).remove();
          document.getElementById(&quot;first-time&quot;).remove();
          EJS_player = &quot;#game&quot;;
          EJS_core = window.gameconfig.core;
          EJS_gameName = window.gameconfig.name;
          EJS_color = &quot;#0064ff&quot;;
          EJS_startOnLoaded = true;
          EJS_pathtodata = &quot;https://cdn.jsdelivr.net/gh/genizy/emu@master/&quot;;
          EJS_gameUrl = gameUrl;
          const script = document.createElement(&quot;script&quot;);
          script.src =
            &quot;https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js&quot;;
          document.body.appendChild(script);
        })
        .catch((error) =&gt; {
          console.error(error);
          document.getElementById(&quot;loading-progress&quot;).textContent =
            &quot;Error loading game.&quot;;
        });
    &lt;/script&gt;
  &lt;/body&gt;

<script>
function goFs() {
  var g = document.getElementById('game');
  var el = document.fullscreenElement || document.webkitFullscreenElement;
  if (el) {
    if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  var ok = false;
  if (g.requestFullscreen) { g.requestFullscreen().then(function(){ok=true;}).catch(function(){}); }
  else if (g.webkitRequestFullscreen) { g.webkitRequestFullscreen(); ok = true; }
  if (!ok) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
  }
}
</script>
