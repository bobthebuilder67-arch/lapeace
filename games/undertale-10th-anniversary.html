<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>la peace</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="topbar">
  <a class="back" href="../index.html">&#8592; la peace</a>
  <span class="gname">Undertale 10th Anniversary</span>
  <button class="fs" onclick="goFs()" title="Fullscreen">&#x26F6;</button>
</div>
<div class="stage" id="stage"><iframe id="game" srcdoc="&lt;iframe src=&quot;https://ut10-battle.undertale.com&quot; width=&quot;100%&quot; height=&quot;100%&quot; allow=&quot;fullscreen https://ut10-battle.undertale.com&quot; allowfullscreen=&quot;true&quot;&gt;" style="width:100%;height:100%;border:none;background:#000;" allow="accelerometer; autoplay; bluetooth; camera; clipboard-read; clipboard-write; cross-origin-isolated; display-capture; encrypted-media; fullscreen; gamepad; geolocation; gyroscope; hid; identity-credentials-get; idle-detection; local-fonts; magnetometer; microphone; midi; payment; picture-in-picture; publickey-credentials-get; screen-wake-lock; serial; usb; web-share; window-management; xr-spatial-tracking; keyboard-map" allowfullscreen="true"></iframe></div>
<script>
function goFs() {
  var g = document.getElementById('game');
  var el = document.fullscreenElement || document.webkitFullscreenElement;
  if (el) {
    if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  var ok = false;
  if (g.requestFullscreen) { g.requestFullscreen().then(function(){ok=true;}).catch(function(){}); }
  else if (g.webkitRequestFullscreen) { g.webkitRequestFullscreen(); ok = true; }
  if (!ok) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
  }
}
</script>
</body>
</html>
