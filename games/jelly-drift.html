</div>
<div class="stage" id="stage"><iframe id="game" srcdoc="&lt;!-- Ultimate Game Stash file--&gt; 
&lt;!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ --&gt;

&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en-us&quot;&gt;
  &lt;head&gt;
	&lt;base href=&quot;https://cdn.jsdelivr.net/gh/genizy/web-port@main/jelly-drift/&quot;&gt;
    &lt;meta charset=&quot;utf-8&quot;&gt;
    &lt;meta http-equiv=&quot;Content-Type&quot; content=&quot;text/html; charset=utf-8&quot;&gt;
    &lt;title&gt;Unity WebGL Player | Jelly Drift&lt;/title&gt;

    &lt;script src=&quot;Build/UnityLoader.js&quot;&gt;&lt;/script&gt;
      		&lt;style&gt;
			* {
				margin: 0;
				padding: 0;
				border: 0;
				overflow: hidden;
			}

			body {
				background: #000;
				position: fixed;
				width: 100%;
				height: 100%;
			}

			#unityContainer {
				position: absolute;
				width: 100%;
				height: 100%;
			}
		&lt;/style&gt;
&lt;script&gt;
			let max = 0;
			let done = 0;
			function mergeFiles(fileParts) {
				return new Promise((resolve, reject) =&gt; {
					let buffers = [];

					function fetchPart(index) {
						if (index &gt;= fileParts.length) {
							let mergedBlob = new Blob(buffers);
							let mergedFileUrl = URL.createObjectURL(mergedBlob);
							resolve(mergedFileUrl);
							return;
						}
						fetch(fileParts[index])
							.then((response) =&gt; response.arrayBuffer())
							.then((data) =&gt; {
								buffers.push(data);
								done = done+1;
								document.querySelector(&quot;#loading-text&quot;).textContent = `LOADING... (${done}/${max})`;
								fetchPart(index + 1);
							})
							.catch(reject);
					}
					fetchPart(0);
				});
			}

			function getParts(file, start, end) {
				let parts = [];
				for (let i = start; i &lt;= end; i++) {
					parts.push(file + &quot;.part&quot; + i);
				}
				max = max+end;
				return parts;
			}

			function resizeUnityContainer() {
				var container = document.getElementById(&quot;unityContainer&quot;);
				container.style.width = window.innerWidth + &quot;px&quot;;
				container.style.height = window.innerHeight + &quot;px&quot;;
			}
			Promise.all([
				mergeFiles(getParts(&quot;Build/jellydrift.data.unityweb&quot;, 1, 3)),
        mergeFiles(getParts(&quot;Build/jellydrift.wasm.code.unityweb&quot;, 1, 2)),
			]).then(([dataUrl, wasmurl]) =&gt; {
				window.dataUrll = dataUrl;
        window.wasmurll = wasmurl;
				var json = {
&quot;companyName&quot;: &quot;Dani&quot;,
&quot;productName&quot;: &quot;Jelly Drift&quot;,
&quot;productVersion&quot;: &quot;0.4&quot;,
&quot;dataUrl&quot;: dataUrl,
&quot;wasmCodeUrl&quot;: wasmurl,
&quot;wasmFrameworkUrl&quot;: &quot;jellydrift.wasm.framework.js&quot;,
&quot;graphicsAPI&quot;: [&quot;WebGL 2.0&quot;],
&quot;webglContextAttributes&quot;: {&quot;preserveDrawingBuffer&quot;: false},
&quot;splashScreenStyle&quot;: &quot;Dark&quot;,
&quot;backgroundColor&quot;: &quot;#231F20&quot;,
&quot;developmentBuild&quot;: false,
&quot;multithreading&quot;: false,
&quot;unityVersion&quot;: &quot;2019.4.19f1&quot;
};
				let blob = new Blob([JSON.stringify(json)], {
					type: &quot;application/json&quot;,
				});
				let blobUrl = URL.createObjectURL(blob);
				window.addEventListener(&quot;resize&quot;, resizeUnityContainer);
				UnityLoader.instantiate(&quot;unityContainer&quot;, json, {
					url: blobUrl,
					Module: {
						onRuntimeInitialized: function () {
							resizeUnityContainer();
							document.querySelector(&quot;#loading-text&quot;).remove();
						},
					},
				});
			});
		&lt;/script&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;div class=&quot;webgl-content&quot;&gt;
      			&lt;div
				id=&quot;loading-text&quot;
				style=&quot;
					color: white;
					font-size: 48px;
					font-family: cursive;
					text-align: center;
					margin-top: 20px;
				&quot;
			&gt;
				LOADING...
			&lt;/div&gt;
      &lt;div id=&quot;unityContainer&quot; style=&quot;width: 960px; height: 600px&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/body&gt;

<script>
function goFs() {
  var g = document.getElementById('game');
  var el = document.fullscreenElement || document.webkitFullscreenElement;
  if (el) {
    if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  var ok = false;
  if (g.requestFullscreen) { g.requestFullscreen().then(function(){ok=true;}).catch(function(){}); }
  else if (g.webkitRequestFullscreen) { g.webkitRequestFullscreen(); ok = true; }
  if (!ok) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
  }
}
</script>
