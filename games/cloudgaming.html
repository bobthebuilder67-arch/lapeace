&lt;title&gt;Figure Cloud&lt;/title&gt;
&lt;style&gt;
@import url(&#39;https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=Great+Vibes&amp;display=swap&#39;);

:root {
  --bg: #050505;
  --glass: rgba(18, 18, 22, 0.75);
  --glass-hover: rgba(30, 30, 36, 0.85);
  --border: rgba(255, 255, 255, 0.08);
  --text: #f5f5f7;
  --muted: #888890; 
  --accent: #ffffff;
}

body {
  margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: &#39;Inter&#39;, sans-serif; overflow-x: hidden;
  -webkit-font-smoothing: antialiased; user-select: none;
  height: 100vh; display: flex; flex-direction: column;
  contain: content;
}

::-webkit-scrollbar { width: 0; height: 0; }

.top-notch-container {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%) translateZ(0);
  z-index: 1000;
  display: flex;
  gap: 10px;
  background: rgba(10, 10, 12, 0.65);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 40px;
  padding: 5px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform;
}

.top-notch {
  background: transparent;
  border-radius: 30px;
  padding: 8px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  border: 1px solid transparent;
}

.top-notch:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
}

  font-weight: 600;
  cursor: pointer;
  padding: 8px 16px;
  border-radius: 10px;
}

.mobl-nav-btn.active {
  color: #ffffff;
}

.mobl-nav-btn svg, .mobl-nav-btn img {
  width: 20px;
  height: 20px;
}

body.is-mobile-device #sidebar-nav {
  display: none !important;
}

body.is-mobile-device #mobl-nav {
  display: flex;
}

body.is-mobile-device .game-mobl-bar {
  display: flex;
}

body.is-mobile-device #app-wrap {
  padding: 80px 16px 100px 16px !important;
}

body.is-mobile-device .hero-cont {
  height: 250px;
  border-radius: 14px;
}

body.is-mobile-device .h-title {
  font-size: 26px;
  letter-spacing: -1px;
}

body.is-mobile-device .h-over {
  padding: 20px;
}

body.is-mobile-device .sec-head {
  font-size: 17px;
  margin-top: 30px;
  margin-bottom: 12px;
}

body.is-mobile-device .grid-h {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding-bottom: 10px;
  gap: 12px;
  -webkit-overflow-scrolling: touch;
}

body.is-mobile-device .grid-h .c-h {
  width: 240px;
  flex-shrink: 0;
  scroll-snap-align: start;
  border-radius: 12px;
}

body.is-mobile-device .grid-v {
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px;
}

body.is-mobile-device .c-v {
  border-radius: 10px;
}

body.is-mobile-device .c-inf {
  padding: 15px 10px 10px;
  opacity: 1;
  transform: translateY(0);
}

body.is-mobile-device .c-inf h3 {
  font-size: 13px;
  margin-bottom: 2px;
}

body.is-mobile-device .c-inf span {
  font-size: 9px;
}

body.is-mobile-device .m-grid {
  flex-direction: column;
  padding: 20px;
  gap: 20px;
  margin-top: 40px;
}

body.is-mobile-device .m-l {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

body.is-mobile-device .m-l img {
  width: 130px;
  height: 170px;
  object-fit: cover;
  margin-bottom: 15px;
}

body.is-mobile-device .m-r {
  width: 100%;
  padding-top: 0;
  text-align: center;
}

body.is-mobile-device .m-t {
  font-size: 28px;
  margin-bottom: 6px;
}

body.is-mobile-device .m-d {
  font-size: 12px;
  margin-bottom: 16px;
}

body.is-mobile-device .m-tgs {
  justify-content: center;
  margin-bottom: 16px;
}

body.is-mobile-device .m-desc {
  font-size: 13px;
  text-align: left;
}

body.is-mobile-device .m-req {
  grid-template-columns: 1fr;
  gap: 16px;
  text-align: left;
}

body.is-mobile-device .m-close {
  top: 15px;
  right: 15px;
}

body.is-mobile-device .top-notch-container {
  top: 10px;
  padding: 4px;
}

body.is-mobile-device .top-notch {
  padding: 5px 12px;
}

body.is-mobile-device .top-notch span {
  font-size: 10px;
}

function msToTm(s){if(!s)return&quot;0m&quot;;let h=Math.floor(s/3600);let m=Math.floor((s%3600)/60);return h&gt;0 ? h + &quot;h &quot; + m + &quot;m&quot; : m + &quot;m&quot;;}

function isMobileDeviceDetected() {
  let u = navigator.userAgent || navigator.vendor || window.opera || &quot;&quot;;
  let isMblStr = /android|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile|tablet/i.test(u.toLowerCase());
  let hasTouch = (&#39;ontouchstart&#39; in window) || (navigator.maxTouchPoints &gt; 0) || (navigator.msMaxTouchPoints &gt; 0);
  let isNavTouch = navigator.maxTouchPoints &amp;&amp; navigator.maxTouchPoints &gt; 1;
  return isMblStr || (hasTouch &amp;&amp; isNavTouch);
}

function populatHistry() {
  let container = document.getElementById(&#39;sb-history-container&#39;);
  if (!container) return;
  let playedIds = Object.keys(lsDB)
    .filter(function(k) { return lsDB[k] &amp;&amp; lsDB[k].t &gt; 0; })
    .sort(function(a, b) { return (lsDB[b].l || 0) - (lsDB[a].l || 0); });
  
  if (playedIds.length === 0) {
    container.innerHTML = &#39;&lt;div style=&quot;padding:15px; font-size:11px; color:var(--muted); text-align:center; font-weight:500;&quot;&gt;No History&lt;/div&gt;&#39;;
    return;
  }
  
  let htmlStr = &#39;&#39;;
  let maxShow = 15;
  playedIds.slice(0, maxShow).forEach(function(id) {
    let g = G_DATA.find(function(x) { return x.id === id; });
    if (g) {
      let timeStr = msToTm(lsDB[id].t);
      htmlStr += &#39;&lt;div class=&quot;sb-hist-item&quot; onclick=&quot;opMdl(\&#39;&#39;+g.id+&#39;\&#39;)&quot; title=&quot;&#39;+g.n+&#39;&quot;&gt;&lt;img src=&quot;&#39;+g.img+&#39;&quot; class=&quot;sb-hist-img&quot; loading=&quot;lazy&quot;&gt;&lt;div class=&quot;sb-hist-info&quot;&gt;&lt;span class=&quot;sb-hist-name&quot;&gt;&#39;+g.n+&#39;&lt;/span&gt;&lt;span class=&quot;sb-hist-time&quot;&gt;Played: &#39;+timeStr+&#39;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&#39;;
    }
  });
  container.innerHTML = htmlStr;
}

function updateLiveStats() {
  let now = new Date();
  let hrs = now.getHours();
  let mins = now.getMinutes().toString().padStart(2, &#39;0&#39;);
  let ampm = hrs &gt;= 12 ? &#39;PM&#39; : &#39;AM&#39;;
  hrs = hrs % 12;
  hrs = hrs ? hrs : 12;
  let clockEl = document.getElementById(&#39;sb-clock&#39;);
  if (clockEl) clockEl.innerText = hrs + &#39;:&#39; + mins + &#39; &#39; + ampm;

  let sitePlaytme = Object.values(lsDB).reduce(function(acc, curr) { return acc + (curr.t || 0); }, 0);
  let totalEl = document.getElementById(&#39;sb-total-time&#39;);
  if (totalEl) {
    totalEl.innerText = msToTm(sitePlaytme);
  }
}

    if (valid &amp;&amp; dist &lt; bestDist) { bestDist = dist; best = el; }

function iP() {

      r: pType === &#39;snow&#39; ? Math.random() * 2 + 1 : pType === &#39;bubbles&#39; ? Math.random() * 3 + 1 : 2,
      vy: pType === &#39;snow&#39; ? Math.random() * 0.8 + 0.3 : pType === &#39;rain&#39; ? Math.random() * 10 + 6 : pType === &#39;bubbles&#39; ? -(Math.random() * 1.5 + 0.5) : (Math.random() * 1 - 0.5),

}

function aP() {
  if (!pCtx) {
    requestAnimationFrame(aP);
    return;
  }
  pCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  if (pType !== &#39;none&#39;) {
    pArr.forEach(function(p) {
      pCtx.beginPath();
      if (pType === &#39;rain&#39;) { pCtx.rect(p.x, p.y, 1, p.l); pCtx.fillStyle = p.c; }
      else if (pType === &#39;matrix&#39;) { pCtx.font = &quot;12px monospace&quot;; pCtx.fillStyle = p.c; pCtx.fillText(p.char, p.x, p.y); }
      else { pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); pCtx.fillStyle = p.c; }
      pCtx.fill();
      
      p.x += p.vx; p.y += p.vy;
      if (p.y &gt; window.innerHeight) { p.y = -10; p.x = Math.random() * window.innerWidth; }
      if (p.y &lt; -10) { p.y = window.innerHeight + 10; p.x = Math.random() * window.innerWidth; }
    });
  }
  requestAnimationFrame(aP);
}
