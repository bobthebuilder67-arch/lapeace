        function formatSize(bytes) {
            if (bytes &gt; 1024 * 1024 * 1024) {
                return (bytes / (1024 * 1024 * 1024)).toFixed(2) + &quot; GB&quot;;
            } else if (bytes &gt; 1024 * 1024) {
                return (bytes / (1024 * 1024)).toFixed(2) + &quot; MB&quot;;
            } else if (bytes &gt; 1024) {
                return (bytes / 1024).toFixed(2) + &quot; KB&quot;;
            } else {
                return bytes + &quot; B&quot;;
            }
        }
        async function getSize(url) {
            try {
                const res = await fetch(url, {
                    method: &quot;HEAD&quot;
                });
                return parseInt(res.headers.get(&quot;Content-Length&quot;) || &quot;0&quot;, 10);
            } catch {
                return 0;
            }
        }
        async function fetchWithProgress(url) {
            const response = await fetch(url);
            const reader = response.body.getReader();
            let chunks = [];
            let received = 0;
            while (true) {
                const {
                    done,
                    value
                } = await reader.read();
                if (done) break;
                received += value.length;
                loadedBytes += value.length;
                chunks.push(value);
                const doneText = formatSize(loadedBytes);
                const totalText = formatSize(totalBytes);
                const percent = totalBytes &gt; 0 ? ((loadedBytes / totalBytes) * 100).toFixed(1) : &quot;?&quot;;
                loadingText.textContent = `LOADING... ${doneText} / ${totalText} (${percent}%)`;
            }
            let fullBuffer = new Uint8Array(received);
            let offset = 0;
            for (let chunk of chunks) {
                fullBuffer.set(chunk, offset);
                offset += chunk.length;
            }
            return fullBuffer.buffer;
        }
        async function mergeFiles(parts) {
            const buffers = await Promise.all(parts.map(fetchWithProgress));
            return URL.createObjectURL(new Blob(buffers));

<script>
function goFs() {
  var g = document.getElementById('game');
  var el = document.fullscreenElement || document.webkitFullscreenElement;
  if (el) {
    if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  var ok = false;
  if (g.requestFullscreen) { g.requestFullscreen().then(function(){ok=true;}).catch(function(){}); }
  else if (g.webkitRequestFullscreen) { g.webkitRequestFullscreen(); ok = true; }
  if (!ok) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
  }
}
