<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>la peace</title>
<link rel="stylesheet" href="../style.css">
<style>
  .consoles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 12px; }
  .console-btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid #d8e0e6;
    background: #f2f5f7;
    color: #212121;
    font: 700 13px Lato, sans-serif;
    cursor: pointer;
    transition: all .12s;
  }
  .console-btn:hover { border-color: #226e93; color: #226e93; }
  .console-btn.active { background: #226e93; color: #fff; border-color: #226e93; }
  .hint { text-align: center; color: #5f6b73; font-size: 13px; padding: 8px 12px; }
  #player-box { flex: 1; position: relative; background: #000; overflow: hidden; min-height: 480px; }
  #player-box #game { position: absolute; inset: 0; }
  .lib-label {
    text-align: center;
    color: #8fa1b5;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 14px 0 8px;
    background: #0a0e13;
  }
  #lib { width: 100%; height: 70vh; border: none; background: #fff; display: block; }
  body { overflow-y: auto; }
  .home { height: auto; min-height: 100vh; }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="../index.html">&#8592; la peace</a>
  <span class="gname">Emulator JS</span>
  <button class="fs" onclick="goFs()" title="Fullscreen">&#x26F6;</button>
</div>

<div class="consoles" id="console-bar">
  <button class="console-btn active" data-core="nes" onclick="pickCore('nes', this)">NES</button>
  <button class="console-btn" data-core="snes" onclick="pickCore('snes', this)">SNES</button>
  <button class="console-btn" data-core="gba" onclick="pickCore('gba', this)">GBA</button>
  <button class="console-btn" data-core="gb" onclick="pickCore('gb', this)">Game Boy</button>
  <button class="console-btn" data-core="n64" onclick="pickCore('n64', this)">N64</button>
  <button class="console-btn" data-core="psx" onclick="pickCore('psx', this)">PS1</button>
</div>

<div class="hint" id="hint">Pick a console, then click <b>Load File</b> / drag &amp; drop. Or browse the library below.</div>

<div id="player-box">
  <div id="game"></div>
</div>

<div class="lib-label">Library</div>
<iframe id="lib" src="https://classicgamezone.com/" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
  allow="autoplay; clipboard-read; clipboard-write; encrypted-media; fullscreen; gamepad; keyboard-map; picture-in-picture"></iframe>

<script>
var CURRENT_CORE = 'nes';
var PATHTODATA = 'https://cdn.emulatorjs.org/stable/data/';
var LOADER = 'https://cdn.emulatorjs.org/stable/data/loader.js';

function pickCore(core, btn) {
  if (core === CURRENT_CORE) return;
  CURRENT_CORE = core;
  document.querySelectorAll('.console-btn').forEach(function (b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  loadEJS();
}

function loadEJS() {
  var box = document.getElementById('game');
  box.innerHTML = '<div style="color:#fff;font-family:system-ui;padding:30px;text-align:center;">Loading...</div>';
  window.EJS_player = '#game';
  window.EJS_core = CURRENT_CORE;
  window.EJS_pathtodata = PATHTODATA;
  window.EJS_language = 'en';
  var s = document.createElement('script');
  s.src = LOADER + '?v=' + Date.now();
  document.getElementById('game').appendChild(s);
}

function goFs() {
  var g = document.getElementById('game');
  var el = document.fullscreenElement || document.webkitFullscreenElement;
  if (el) {
    if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  var ok = false;
  if (g.requestFullscreen) { g.requestFullscreen().then(function(){ok=true;}).catch(function(){}); }
  else if (g.webkitRequestFullscreen) { g.webkitRequestFullscreen(); ok = true; }
  if (!ok) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
  }
}

loadEJS();
</script>
</body>
</html>
