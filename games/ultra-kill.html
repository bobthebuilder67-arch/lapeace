<div class="stage" id="stage"><iframe id="game" srcdoc="&lt;!DOCTYPE html&gt;


&lt;!-- Ultimate Game Stash file--&gt; 
&lt;!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ --&gt;
&lt;!-- Made by bread for gn-math --&gt;


&lt;html lang=&quot;en-us&quot;&gt;

&lt;head&gt;
    &lt;base href=&quot;https://cdn.jsdelivr.net/gh/genizy/web-port@master/ultrakill/&quot;&gt;
    &lt;meta charset=&quot;utf-8&quot;&gt;
    &lt;meta http-equiv=&quot;Content-Type&quot; content=&quot;text/html; charset=utf-8&quot;&gt;
    &lt;title&gt;Unity WebGL Player | ULTRAKILL&lt;/title&gt;
    &lt;style&gt;
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
    &lt;/style&gt;
&lt;/head&gt;

&lt;body style=&quot;text-align: center; padding: 0; border: 0; margin: 0;&quot;&gt;
    &lt;div id=&#39;loading-text&#39; style=&quot;color: black; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;&quot;&gt;LOADING...&lt;/div&gt;
    &lt;canvas id=&quot;unity-canvas&quot; tabindex=&quot;-1&quot; hidden&gt;&lt;/canvas&gt;
    &lt;script src=&quot;Build/ultrakill.loader.js&quot;&gt;&lt;/script&gt;
    &lt;script&gt;
        var canvas = document.querySelector(&quot;#unity-canvas&quot;);
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // Mobile device style: fill the whole browser client area with the game canvas:
            var meta = document.createElement(&#39;meta&#39;);
            meta.name = &#39;viewport&#39;;
            meta.content = &#39;width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes&#39;;
            document.getElementsByTagName(&#39;head&#39;)[0].appendChild(meta);
            canvas.style.width = &quot;100%&quot;;
            canvas.style.height = &quot;100%&quot;;
            canvas.style.position = &quot;fixed&quot;;
            document.body.style.textAlign = &quot;left&quot;;
        } else {
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.style.width = window.innerWidth + &quot;px&quot;;
                canvas.style.height = window.innerHeight + &quot;px&quot;;
            }
            resizeCanvas();
            window.addEventListener(&#39;resize&#39;, resizeCanvas);
        }

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) =&gt; {
                let buffers = [];

                function fetchPart(index) {
                    if (index &gt;= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    fetch(fileParts[index]).then((response) =&gt; response.arrayBuffer()).then((data) =&gt; {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i &lt;= end; i++) {
                parts.push(file + &quot;.part&quot; + i);
            }
            return parts;
        }
        Promise.all([
            mergeFiles(getParts(&quot;Build/ultrakill.data.unityweb&quot;, 1, 4)),
            mergeFiles(getParts(&quot;Build/ultrakill.wasm.unityweb&quot;, 1, 2))
        ]).then(([dataUrl, wasmurl]) =&gt; {
            document.querySelector(&quot;#unity-canvas&quot;).hidden = false;
            createUnityInstance(document.querySelector(&quot;#unity-canvas&quot;), {
                dataUrl: dataUrl,
                frameworkUrl: &quot;Build/ultrakill.framework.js.unityweb&quot;,
                codeUrl: wasmurl,
                streamingAssetsUrl: &quot;StreamingAssets&quot;,
                companyName: &quot;Hakita and Cake Logic&quot;,
                productName: &quot;ULTRAKILL&quot;,
                productVersion: &quot;1.4&quot;,
                // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
                // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
            }).then((e) =&gt; {
                document.querySelector(&quot;#loading-text&quot;).remove();
            });
        });
    &lt;/script&gt;
&lt;/body&gt;

&lt;/html&gt;" style="width:100%;height:100%;border:none;background:#000;" allow="accelerometer; autoplay; bluetooth; camera; clipboard-read; clipboard-write; cross-origin-isolated; display-capture; encrypted-media; fullscreen; gamepad; geolocation; gyroscope; hid; identity-credentials-get; idle-detection; local-fonts; magnetometer; microphone; midi; payment; picture-in-picture; publickey-credentials-get; screen-wake-lock; serial; usb; web-share; window-management; xr-spatial-tracking; keyboard-map" allowfullscreen="true"></iframe></div>
<script>
function goFs() {
  var g = document.getElementById('game');
  var el = document.fullscreenElement || document.webkitFullscreenElement;
  if (el) {
    if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  var ok = false;
  if (g.requestFullscreen) { g.requestFullscreen().then(function(){ok=true;}).catch(function(){}); }
  else if (g.webkitRequestFullscreen) { g.webkitRequestFullscreen(); ok = true; }
  if (!ok) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
  }
}
</script>
</body>
</html>
