<div class="stage" id="stage"><iframe id="game" srcdoc="&lt;!DOCTYPE html&gt;


&lt;!-- Ultimate Game Stash file--&gt; 
&lt;!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ --&gt;



&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;utf-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, user-scalable=no, initial-scale=1.0&quot;&gt;
  &lt;title&gt;CrazyCattle3D&lt;/title&gt;
  &lt;style&gt;
    html,
    body,
    #canvas {
      margin: 0;
      padding: 0;
      border: 0;
    }

    body {
      color: white;
      background-color: black;
      overflow: hidden;
      touch-action: none;
    }

    #canvas {
      display: block;
    }

    #canvas:focus {
      outline: none;
    }

    #status,
    #status-splash, 
    #status-progress { 
      position: absolute;
      left: 0;
      right: 0;
    }

    #status,
    #status-splash {
      top: 0;
      bottom: 0;
    }

    #status {
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      visibility: hidden;
    }

    #status-splash {
      max-height: 100%;
      max-width: 100%;
      margin: auto;
    }

    #status-splash.show-image--false {
      display: none;
    }

    #status-splash.fullsize--true {
      height: 100%;
      width: 100%;
      object-fit: contain;
    }

    #status-splash.use-filter--false {
      image-rendering: pixelated;
    }

    #status-progress,
    #status-notice {
      display: none;
    }

    #status-progress {
      bottom: 10%;
      width: 50%;
      margin: 0 auto;
    }

    #status-notice {
      background-color: #5b3943;
      border-radius: 0.5rem;
      border: 1px solid #9b3943;
      color: #e0e0e0;
      font-family: &#39;Noto Sans&#39;, &#39;Droid Sans&#39;, Arial, sans-serif;
      line-height: 1.3;
      margin: 0 2rem;
      overflow: hidden;
      padding: 1rem;
      text-align: center;
      z-index: 1;
    }
  &lt;/style&gt;
  &lt;link id=&quot;-gd-engine-icon&quot; rel=&quot;icon&quot; type=&quot;image/png&quot; href=&quot;https://cdn.jsdelivr.net/gh/bubbls/cc3d-merge/index.icon.png&quot; /&gt;
  &lt;link rel=&quot;apple-touch-icon&quot; href=&quot;https://cdn.jsdelivr.net/gh/bubbls/cc3d-merge/index.apple-touch-icon.png&quot; /&gt;

  &lt;script&gt;

    const CDN_BASE = &#39;https://cdn.jsdelivr.net/gh/bubbls/cc3d-merge/&#39;;
    
    async function mergeSplitFiles(baseName, numParts) {
      try {
        const parts = [];
        for (let i = 1; i &lt;= numParts; i++) {
          parts.push(`${CDN_BASE}${baseName}.part${i}`);
        }

        console.log(`Merging ${baseName} from ${numParts} parts...`);
        
        const responses = await Promise.all(parts.map(part =&gt; 
          fetch(part).catch(err =&gt; {
            console.error(`Failed to fetch ${part}:`, err);
            throw new Error(`Failed to load ${part}`);
          })
        ));
        
        for (let i = 0; i &lt; responses.length; i++) {
          if (!responses[i].ok) {
            throw new Error(`Failed to load ${parts[i]}: ${responses[i].status} ${responses[i].statusText}`);
          }
        }

        const buffers = await Promise.all(responses.map(r =&gt; r.arrayBuffer()));
        
        const totalSize = buffers.reduce((sum, buf) =&gt; sum + buf.byteLength, 0);
        

        const mergedArray = new Uint8Array(totalSize);
        let offset = 0;
        for (const buffer of buffers) {
          mergedArray.set(new Uint8Array(buffer), offset);
          offset += buffer.byteLength;
        }

        console.log(`${baseName} merged successfully: ${totalSize} bytes`);
        return mergedArray.buffer;
      } catch (error) {
        console.error(`Error merging ${baseName}:`, error);
        throw error;
      }
    }

    window.mergedFiles = {
      pck: null,
      wasm: null
    };

    if (!window.originalFetch) {
      window.originalFetch = window.fetch;
    }

    window.fetch = function(url, ...args) {
      const urlStr = typeof url === &#39;string&#39; ? url : url.toString();
      
      if (urlStr.includes(&#39;index.pck&#39;) &amp;&amp; !urlStr.includes(&#39;.part&#39;)) {
        console.log(&#39;Intercepting index.pck request&#39;);
        return new Promise((resolve) =&gt; {
          const checkData = setInterval(() =&gt; {
            if (window.mergedFiles.pck) {
              clearInterval(checkData);
              resolve(new Response(window.mergedFiles.pck, {
                status: 200,
                statusText: &#39;OK&#39;,
                headers: {
                  &#39;Content-Type&#39;: &#39;application/octet-stream&#39;,
                  &#39;Content-Length&#39;: window.mergedFiles.pck.byteLength
                }
              }));
            }
          }, 50);
        });
      }
      
      if (urlStr.includes(&#39;index.wasm&#39;) &amp;&amp; !urlStr.includes(&#39;.part&#39;)) {
        console.log(&#39;Intercepting index.wasm request&#39;);
        return new Promise((resolve) =&gt; {
          const checkData = setInterval(() =&gt; {
            if (window.mergedFiles.wasm) {
              clearInterval(checkData);
              resolve(new Response(window.mergedFiles.wasm, {
                status: 200,
                statusText: &#39;OK&#39;,
                headers: {
                  &#39;Content-Type&#39;: &#39;application/wasm&#39;,
                  &#39;Content-Length&#39;: window.mergedFiles.wasm.byteLength
                }
              }));
            }
          }, 50);
        });
      }
      
      return window.originalFetch.call(this, url, ...args);
    };

    (async function() {
      try {
        const [pckBuffer, wasmBuffer] = await Promise.all([
          mergeSplitFiles(&#39;index.pck&#39;, 3),
          mergeSplitFiles(&#39;index.wasm&#39;, 3)
        ]);
        
        window.mergedFiles.pck = pckBuffer;
        window.mergedFiles.wasm = wasmBuffer;
        
        console.log(&#39;All files merged and ready!&#39;);
      } catch (error) {
        console.error(&#39;Failed to merge files:&#39;, error);
        alert(&#39;Failed to load game files. Please check that all .part files are uploaded to your CDN.\n\nError: &#39; + error.message);
      }
    })();
  &lt;/script&gt;
&lt;/head&gt;

&lt;body&gt;
  &lt;canvas id=&quot;canvas&quot;&gt;
    Your browser does not support the canvas tag.
  &lt;/canvas&gt;

  &lt;noscript&gt;
    Your browser does not support JavaScript.
  &lt;/noscript&gt;

  &lt;div id=&quot;status&quot;&gt;
    &lt;img id=&quot;status-splash&quot; class=&quot;show-image--true fullsize--true use-filter--true&quot; src=&quot;https://cdn.jsdelivr.net/gh/bubbls/cc3d-merge/index.png&quot; alt=&quot;&quot;&gt;
    &lt;progress id=&quot;status-progress&quot;&gt;&lt;/progress&gt;
    &lt;div id=&quot;status-notice&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;script src=&quot;https://cdn.jsdelivr.net/gh/bubbls/cc3d-merge/index.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt; 
    const GODOT_CONFIG = {
      &quot;args&quot;: [],
      &quot;canvasResizePolicy&quot;: 2,
      &quot;ensureCrossOriginIsolationHeaders&quot;: true,
      &quot;executable&quot;: &quot;index&quot;,
      &quot;experimentalVK&quot;: false,
      &quot;fileSizes&quot;: {
        &quot;index.pck&quot;: 42336176,
        &quot;index.wasm&quot;: 43699190
      },
      &quot;focusCanvas&quot;: true,
      &quot;gdextensionLibs&quot;: []
    };
    const GODOT_THREADS_ENABLED = false;
    const engine = new Engine(GODOT_CONFIG);

    (function() {
      const statusOverlay = document.getElementById(&#39;status&#39;);
      const statusProgress = document.getElementById(&#39;status-progress&#39;);
      const statusNotice = document.getElementById(&#39;status-notice&#39;);

      let initializing = true;
      let statusMode = &#39;&#39;;

      function setStatusMode(mode) {
        if (statusMode === mode || !initializing) {
          return;
        }
        if (mode === &#39;hidden&#39;) {
          statusOverlay.remove();
          initializing = false;
          return;
        }
        statusOverlay.style.visibility = &#39;visible&#39;;
        statusProgress.style.display = mode === &#39;progress&#39; ? &#39;block&#39; : &#39;none&#39;;
        statusNotice.style.display = mode === &#39;notice&#39; ? &#39;block&#39; : &#39;none&#39;;
        statusMode = mode;
      }

      function setStatusNotice(text) {
        while (statusNotice.lastChild) {
          statusNotice.removeChild(statusNotice.lastChild);
        }
        const lines = text.split(&#39;\n&#39;);
        lines.forEach((line) =&gt; {
          statusNotice.appendChild(document.createTextNode(line));
          statusNotice.appendChild(document.createElement(&#39;br&#39;));
        });
      }

      function displayFailureNotice(err) {
        console.error(err);
        if (err instanceof Error) {
          setStatusNotice(err.message);
        } else if (typeof err === &#39;string&#39;) {
          setStatusNotice(err);
        } else {
          setStatusNotice(&#39;An unknown error occurred.&#39;);
        }
        setStatusMode(&#39;notice&#39;);
        initializing = false;
      }

      const missing = Engine.getMissingFeatures({
        threads: GODOT_THREADS_ENABLED,
      });

      if (missing.length !== 0) {
        const missingMsg = &#39;Error\nThe following features required to run Godot projects on the Web are missing:\n&#39;;
        displayFailureNotice(missingMsg + missing.join(&#39;\n&#39;));
      } else {
        setStatusMode(&#39;progress&#39;);
        engine.startGame({
          &#39;onProgress&#39;: function(current, total) {
            if (current &gt; 0 &amp;&amp; total &gt; 0) {
              statusProgress.value = current;
              statusProgress.max = total;
            } else {
              statusProgress.removeAttribute(&#39;value&#39;);
              statusProgress.removeAttribute(&#39;max&#39;);
            }
          },
        }).then(() =&gt; {
          setStatusMode(&#39;hidden&#39;);
        }, displayFailureNotice);
      }
    }());
  &lt;/script&gt;

<script>
function goFs() {
  var g = document.getElementById('game');
  var el = document.fullscreenElement || document.webkitFullscreenElement;
  if (el) {
    if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  var ok = false;
  if (g.requestFullscreen) { g.requestFullscreen().then(function(){ok=true;}).catch(function(){}); }
  else if (g.webkitRequestFullscreen) { g.webkitRequestFullscreen(); ok = true; }
  if (!ok) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
  }
}
</script>
